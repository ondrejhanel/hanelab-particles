<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hanelab</title>
  <style>
    :root {
      color-scheme: dark;
      --teal: rgba(41, 227, 198, 0.35);
      --teal-soft: rgba(168, 255, 242, 0.14);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(7, 29, 27, 0.92), rgba(1, 4, 5, 1) 70%),
        #010405;
      font-family: Arial, sans-serif;
    }

    #app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(60% 45% at 50% 48%, rgba(12, 51, 47, 0.12), rgba(0, 0, 0, 0) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.58)),
        #020707;
      box-shadow:
        inset 0 0 80px rgba(41, 227, 198, 0.06),
        inset 0 0 220px rgba(41, 227, 198, 0.035);
    }

    #app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.45;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0) 12%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 6px
        );
      mix-blend-mode: screen;
    }

    #app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background:
        radial-gradient(75% 55% at 50% 50%, rgba(41, 227, 198, 0.045), rgba(41, 227, 198, 0) 70%),
        radial-gradient(110% 85% at 50% 50%, rgba(168, 255, 242, 0.03), rgba(41, 227, 198, 0) 78%);
    }

    #app canvas {
      display: block;
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>

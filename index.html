<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hanelab</title>
  <style>
    :root {
      color-scheme: dark;
      --teal: rgba(41, 227, 198, 0.35);
      --teal-soft: rgba(168, 255, 242, 0.14);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(7, 29, 27, 0.92), rgba(1, 4, 5, 1) 70%),
        #010405;
      font-family: Arial, sans-serif;
    }

    #app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(60% 45% at 50% 48%, rgba(12, 51, 47, 0.12), rgba(0, 0, 0, 0) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.58)),
        #020707;
      box-shadow:
        inset 0 0 80px rgba(41, 227, 198, 0.06),
        inset 0 0 220px rgba(41, 227, 198, 0.035);
    }

    #app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.45;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0) 12%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 6px
        );
      mix-blend-mode: screen;
    }

    #app::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background:
        radial-gradient(75% 55% at 50% 50%, rgba(41, 227, 198, 0.045), rgba(41, 227, 198, 0) 70%),
        radial-gradient(110% 85% at 50% 50%, rgba(168, 255, 242, 0.03), rgba(41, 227, 198, 0) 78%);
    }

    #app canvas {
      display: block;
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .tuning-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 5;
      width: min(240px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid rgba(168, 255, 242, 0.18);
      border-radius: 12px;
      background: rgba(3, 12, 13, 0.76);
      box-shadow:
        0 10px 32px rgba(0, 0, 0, 0.26),
        inset 0 0 0 1px rgba(41, 227, 198, 0.045);
      backdrop-filter: blur(14px);
      color: rgba(220, 255, 248, 0.92);
      font: 12px/1.35 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      letter-spacing: 0.04em;
      user-select: none;
    }

    .tuning-title {
      margin: 0 0 10px;
      color: rgba(168, 255, 242, 0.9);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .tuning-group + .tuning-group {
      margin-top: 10px;
    }

    .tuning-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .tuning-row label,
    .tuning-row output {
      display: block;
    }

    .tuning-row output {
      color: rgba(168, 255, 242, 0.72);
      font-size: 11px;
    }

    .tuning-value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(168, 255, 242, 0.72);
      font-size: 11px;
    }

    .tuning-value input[type="number"] {
      width: 70px;
      padding: 3px 6px;
      border: 1px solid rgba(168, 255, 242, 0.16);
      border-radius: 7px;
      background: rgba(6, 18, 20, 0.9);
      color: rgba(220, 255, 248, 0.92);
      font: inherit;
      text-align: right;
      outline: none;
    }

    .tuning-value input[type="number"]:focus {
      border-color: rgba(41, 227, 198, 0.45);
      box-shadow: 0 0 0 1px rgba(41, 227, 198, 0.18);
    }

    .tuning-panel input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: rgb(41, 227, 198);
      cursor: ew-resize;
    }

    @media (max-width: 768px) {
      .tuning-panel {
        top: 12px;
        right: 12px;
        width: min(220px, calc(100vw - 24px));
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="tuning-panel" id="tuning-panel">
      <p class="tuning-title">Particle Motion</p>
      <div class="tuning-group">
        <div class="tuning-row">
          <label for="tuning-friction">Friction</label>
          <div class="tuning-value">
            <input id="tuning-friction-number" type="number" min="0.1" max="100" step="0.1" value="50">
            <span>%</span>
          </div>
        </div>
        <input id="tuning-friction" type="range" min="0.001" max="1" step="0.001" value="0.5">
      </div>
      <div class="tuning-group">
        <div class="tuning-row">
          <label for="tuning-radius">Radius</label>
          <div class="tuning-value">
            <input id="tuning-radius-number" type="number" min="1" max="100" step="1" value="20">
            <span>%</span>
          </div>
        </div>
        <input id="tuning-radius" type="range" min="0.01" max="1" step="0.001" value="0.2">
      </div>
      <div class="tuning-group">
        <div class="tuning-row">
          <label for="tuning-particle-count">Particles</label>
          <div class="tuning-value">
            <input id="tuning-particle-count-number" type="number" min="1600" max="1000000" step="100" value="3000">
          </div>
        </div>
        <input id="tuning-particle-count" type="range" min="1600" max="1000000" step="100" value="3000">
      </div>
      <div class="tuning-group">
        <div class="tuning-row">
          <label for="tuning-particle-size">Particle Size</label>
          <div class="tuning-value">
            <input id="tuning-particle-size-number" type="number" min="50" max="250" step="1" value="100">
            <span>%</span>
          </div>
        </div>
        <input id="tuning-particle-size" type="range" min="0.5" max="2.5" step="0.01" value="1">
      </div>
      <div class="tuning-group">
        <div class="tuning-row">
          <label for="tuning-particle-size-randomness">Size Random</label>
          <div class="tuning-value">
            <input id="tuning-particle-size-randomness-number" type="number" min="0" max="100" step="1" value="35">
            <span>%</span>
          </div>
        </div>
        <input id="tuning-particle-size-randomness" type="range" min="0" max="1" step="0.01" value="0.35">
      </div>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
